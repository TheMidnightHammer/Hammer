name: Build Demos (x86 & ARM64)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Vulkan 1.4 Headers & System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libstb-dev libglm-dev libglfw3-dev \
          libvulkan-dev vulkan-validationlayers spirv-tools git

        # Install latest Vulkan 1.4 headers directly to system path
        git clone https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/Vulkan-Headers
        cd /tmp/Vulkan-Headers
        git checkout v1.4.304  # Latest Vulkan 1.4 release tag
        cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
        sudo cmake --install build

    - name: Build Each Demo
      run: |
        for demo_dir in demo/*/; do
          echo "----------------------------------------"
          echo "Building: $demo_dir"
          echo "----------------------------------------"
          
          cd "$demo_dir"
          mkdir -p build && cd build
          
          if ! cmake ..; then
            echo "::error::CMake failed in $demo_dir"
            exit 1
          fi
          
          if ! make; then
            echo "::error::Make failed in $demo_dir"
            exit 1
          fi
          
          echo "Successfully built $demo_dir"
          
          cd "${GITHUB_WORKSPACE}"
        done
